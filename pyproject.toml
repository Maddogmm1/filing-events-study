[project]
name = "filing-events-study"
version = "1.0.0"
description = "Pre-registered event study of SEC filing events (earnings 8-Ks, late filings, restatements, auditor changes) in US small caps"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Matthew Edwards" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17",
    "exchange-calendars>=4.5",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fe"]

[tool.setuptools.package-data]
fe = ["smallcap_schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
